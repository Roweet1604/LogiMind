server {
    listen 80;
    root /usr/share/nginx/html;
    client_max_body_size 6m;  # order files (5 MB) and delivery photos (3 MB)

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 600s;  # copilot calls wait for the solver
    }

    location = /sw.js {
        add_header Cache-Control "no-cache";  # new app versions reach drivers
    }

    location / {
        try_files $uri /index.html;  # client-side routes
    }
}
